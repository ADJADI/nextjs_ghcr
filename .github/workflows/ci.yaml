name: CI

on:
  push:
    branches:
      - main
      - master
      - ghcr
  pull_request:
    branches:
      - main
      - master
      - ghcr

jobs:
  lint:
    runs-on: ubuntu-latest
    # Must match Dockerfile base image (env context is not allowed here)
    container:
      image: node:25-alpine3.23
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit
