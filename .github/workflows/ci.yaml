name: CI

on:
  push:
    branches:
      - main
      - master
      - ghcr
  pull_request:
    branches:
      - main
      - master
      - ghcr

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CI image from Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci
          load: true
          tags: nextjs-ghcr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: ESLint
        run: docker run --rm nextjs-ghcr:ci npm run lint

      - name: Typecheck
        run: docker run --rm nextjs-ghcr:ci npx tsc --noEmit
